name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalpool
        uses: actions/checkout@v4
        with:
          ref: finalpool
          fetch-depth: 0

      - name: Collect implemented tasks
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          rm -rf tasks/finalpool
          mkdir -p tasks/finalpool
          tmp=$(mktemp -d)
          collect() {
            branch="$1"; shift
            dev="${branch%-dev}"; dev="${dev%_dev}"
            for task in "$@"; do
              rm -rf "${tmp:?}/$task"
              mkdir -p "$tmp/$task"
              git archive "origin/$branch" "tasks/$dev/$task" | tar -x -C "$tmp/$task"
              mkdir -p "tasks/finalpool/$task"
              cp -r "$tmp/$task/tasks/$dev/$task/." "tasks/finalpool/$task/"
            done
          }
          collect fan-dev coupon-manager discount-calculator loyalty-program price-tracker
          collect gyy blog-engine cms-builder content-scheduler robots-handler social-publisher tag-manager
          collect haoze media-organizer streaming-service subtitle-generator video-trimmer
          collect jl_dev canvas-grade-automation customer-feedback-processor email-classification-system inventory-management pdf-report-generator
          collect junteng_dev booking-system calendar-sync contact-manager help-desk order-processor product-catalog reminder-service shipment-tracker
          collect junxian_dev qr-generator social-connector translation-api
          collect lueyang-dev activity-logger client-portal crm-system deal-manager email-campaign follow-up-reminder sales-pipeline territory-manager
          collect lv analytics-dashboard chat-bot feedback-collector personalization-service sentiment-analyzer survey-builder voice-processor
          collect ruige canvas-automation data-analytics expense-tracker file-manager log-analyzer web-crawler
          collect wenshuo-dev cache-optimizer image-processor scheduler search-engine
          collect xiaochen_dev backup-utility deployment-tool error-tracker health-monitor monitoring-agent security-scanner status-checker
          collect yuxuan-dev asset-optimizer content-manager network-analyzer sync-service task-scheduler
          collect yuzhen-dev alert-system data-validator form-builder invoice-generator payment-processor permission-manager
          collect zhaochen certificate-manager load-balancer storage-manager template-engine
          echo "collected $(ls tasks/finalpool | wc -l) tasks and $(find tasks/finalpool -type f | wc -l) files"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tasks/finalpool
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add all implemented tasks to tasks/finalpool"
            git push origin HEAD:finalpool
          fi
